<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成功案例 — 坚果留学</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/components.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <div class="crumb"><a href="index.html">首页</a> / 成功案例</div>
    <span class="hero-tag">Success Stories</span>
    <h1>他们已经摘到了梦想的果实</h1>
    <p>每一个 offer 背后，都是一次清晰的定位、一份扎实的文书和一段彼此信任的同行。（以下案例为示意内容，待替换真实学生故事）</p>
  </div>
</section>

<section style="background:var(--cream)">
  <div class="wrap">
    <div class="sec-head" style="margin-bottom:32px">
      <div class="sec-kicker">Filter</div>
      <h2 class="sec-title" style="font-size:28px">按国家 / 地区与学历查看</h2>
    </div>
    <div class="filter-bar" data-filter-group="cases">
      <button class="filter-btn active" data-filter-value="all">全部</button>
      <button class="filter-btn" data-filter-value="英国">英国</button>
      <button class="filter-btn" data-filter-value="中国香港">中国香港</button>
      <button class="filter-btn" data-filter-value="新加坡">新加坡</button>
      <button class="filter-btn" data-filter-value="美国">美国</button>
      <button class="filter-btn" data-filter-value="澳大利亚">澳大利亚</button>
      <button class="filter-btn" data-filter-value="加拿大">加拿大</button>
    </div>
    <div class="filter-bar" data-filter-group="degree" style="margin-top:-18px;margin-bottom:38px">
      <button class="filter-btn active" data-filter-value="all">全部学历</button>
      <button class="filter-btn" data-filter-value="本科">本科</button>
      <button class="filter-btn" data-filter-value="硕士">硕士</button>
    </div>
    <div class="filter-hint" data-filter-hint="cases"></div>
    <div class="case-grid" data-render="cases" style="margin-top:24px"></div>
    <div class="center-cta"><a href="contact.html" class="btn">聊聊你的背景 →</a></div>
  </div>
</section>

<div id="site-footer"></div>

</body>
</html>
